<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图提取 ImageGrab · 图片画廊</title>
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <!-- 顶部工具栏 -->
  <header class="ig-topbar">
    <div class="ig-brand">
      <span class="ig-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
      </span>
      <div class="ig-brand-text">
        <strong>图提取</strong>
        <span id="ig-source" class="ig-source">正在读取来源页面…</span>
      </div>
    </div>

    <div class="ig-tools">
      <label class="ig-check-all">
        <input type="checkbox" id="ig-checkall" />
        <span>全选</span>
      </label>
      <button type="button" id="ig-invert" class="ig-btn ig-btn-ghost">反选</button>
      <span class="ig-count" id="ig-count">已选 0 / 0 张</span>
      <button type="button" id="ig-download" class="ig-btn ig-btn-primary" disabled>
        下载选中
      </button>
    </div>
  </header>

  <!-- 下载进度条 -->
  <div class="ig-progress" id="ig-progress" hidden>
    <div class="ig-progress-bar"><i id="ig-progress-fill"></i></div>
    <span id="ig-progress-text">准备下载…</span>
  </div>

  <!-- 完成反馈横幅 -->
  <div class="ig-banner" id="ig-banner" hidden></div>

  <!-- 图片网格 -->
  <main class="ig-grid" id="ig-grid"></main>

  <!-- 空状态 -->
  <section class="ig-empty" id="ig-empty" hidden>
    <div class="ig-empty-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <path d="M3 15l5-5 4 4 3-3 6 6"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
      </svg>
    </div>
    <h2>没有提取到图片</h2>
    <p>请回到商品详情页，向下滚动让图片加载完成后重新点击「获取图片」。</p>
    <button type="button" id="ig-demo" class="ig-btn ig-btn-ghost">载入演示数据预览界面</button>
  </section>

  <footer class="ig-footer">
    图提取 ImageGrab · 仅供学习演示使用 · 下载文件保存为 PNG 格式
  </footer>

  <script src="gallery.js"></script>
</body>
</html>
